name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Export Static Web App (with GitHub Pages subpath support)
        working-directory: ./frontend
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            pkg.expo.experiments = pkg.expo.experiments || {};
            pkg.expo.experiments.baseUrl = "/" + process.env.REPO_NAME;
            fs.writeFileSync("app.json", JSON.stringify(pkg, null, 2));
          '
          npx expo export --platform web
          cp dist/index.html dist/404.html
        env:
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
